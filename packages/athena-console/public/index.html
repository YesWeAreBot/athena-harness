<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Athena Runtime</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Athena Runtime</h1>
      <button id="refresh">Refresh</button>
    </header>
    <main>
      <section>
        <h2>Lives</h2>
        <form id="life-form">
          <input id="life-id" placeholder="life id" required />
          <input id="life-mode" placeholder="mode" />
          <input id="life-bodies" placeholder="bodies, comma separated" />
          <button type="submit">Create</button>
        </form>
        <div id="lives" class="cards"></div>
      </section>
      <section>
        <h2>Bodies</h2>
        <div id="bodies" class="cards"></div>
      </section>
      <section>
        <h2>Modes</h2>
        <div id="modes" class="cards"></div>
      </section>
      <section>
        <h2>Pipelines</h2>
        <div id="pipelines" class="cards"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
